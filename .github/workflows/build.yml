name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Name the APK after the build number
        run: |
          build=$(sed -n 's/^val closecodeBuild = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          test -n "$build"
          cp app/build/outputs/apk/debug/app-debug.apk "closecode-${build}-debug.apk"
          ls -l "closecode-${build}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: closecode-debug-apk
          path: closecode-*-debug.apk
          if-no-files-found: error

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" closecode-*-debug.apk --clobber
